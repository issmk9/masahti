*{box-sizing:border-box}

.vbtn{flex:1;border:0;background:transparent;color:var(--mute);font:inherit;font-size:14px;padding:10px 4px;border-radius:99px;transition:background .35s cubic-bezier(.3,1.4,.5,1),color .25s,transform .25s}

.enter{animation:vin .5s cubic-bezier(.2,.9,.3,1)}
@keyframes vin{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

.main{position:relative;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}

.side{transition:transform .2s}

.tchips .chip{flex:none}

.trk{fill:none;stroke:var(--line);stroke-width:10}

.tap{position:absolute;inset:9%;border-radius:50%;border:0;background:var(--card);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 14px 34px rgba(75,63,224,.25),inset 0 0 0 1px var(--line);transition:transform .15s cubic-bezier(.3,1.5,.5,1);overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}

.vbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:16px;background:transparent;font-size:11px;position:relative;transform:none;box-shadow:none}

<script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let items=[],db=null;

function openDB(){return new Promise(resolve=>{try{if(!('indexedDB' in window)){resolve(null);return}const q=indexedDB.open('masaha',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('items'))q.result.createObjectStore('items',{keyPath:'id'})};q.onsuccess=()=>{const opened=q.result;opened.onversionchange=()=>opened.close();resolve(opened)};q.onerror=()=>resolve(null);q.onblocked=()=>resolve(null)}catch(e){resolve(null)}})}
function put(it){if(!db){toast('التخزين غير متاح؛ لم يتم حفظ التعديل.');return false}try{const tx=db.transaction('items','readwrite');tx.objectStore('items').put(it);tx.oncomplete=()=>{};tx.onerror=tx.onabort=()=>toast('مقدرتش أحفظ. ممكن مساحة التخزين مليانة أو محظورة.');return true}catch(e){toast('مقدرتش أحفظ.');return false}}
function del(id){if(!db){toast('التخزين غير متاح؛ لم يتم حذف الصفحة.');return false}try{const tx=db.transaction('items','readwrite');tx.objectStore('items').delete(id);tx.onerror=tx.onabort=()=>toast('مقدرتش أحذف الصفحة.');return true}catch(e){toast('مقدرتش أحذف الصفحة.');return false}}
function loadAll(){return new Promise(resolve=>{if(!db){resolve(null);return}try{const q=db.transaction('items').objectStore('items').getAll();q.onsuccess=()=>resolve(Array.isArray(q.result)?q.result:null);q.onerror=()=>resolve(null)}catch(e){resolve(null)}})}

const $=id=>document.getElementById(id);
const _u=new WeakMap();function blobURL(b){if(typeof b==='string')return b;if(!b||typeof b!=='object')return '';let u=_u.get(b);if(!u){u=URL.createObjectURL(b);_u.set(b,u)}return u}function releaseBlobURL(b){if(!b||typeof b!=='object')return;const u=_u.get(b);if(u){URL.revokeObjectURL(u);_u.delete(b)}}
let _et=0;function _err(){const n=Date.now();if(n-_et>8000){_et=n;try{toast('حصل خطأ بسيط. لو استمر اقفل التطبيق وافتحه تاني.')}catch(e){}}}
addEventListener('error',_err);addEventListener('unhandledrejection',_err);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('تعذر حفظ الإعدادات في مساحة التخزين.')}}};
const APP_PREF_KEYS=['forest','ftimer','fdur','view','mig2','habits','shop','dinTab','tasbih','pcity','pcity2','prayed','water','religion','lay','sort'];
async function blobToDataURL(blob){if(typeof blob==='string'&&blob.startsWith('data:'))return blob;if(typeof blob==='string'){const response=await fetch(blob);if(!response.ok)throw new Error('تعذر قراءة المرفق');blob=await response.blob()}if(!(blob instanceof Blob))throw new Error('نوع المرفق غير مدعوم');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error||new Error('تعذر قراءة ملف'));reader.readAsDataURL(blob)})}
async function dataURLToBlob(value){if(typeof value!=='string'||!value.startsWith('data:'))throw new Error('صيغة المرفق غير صحيحة');const response=await fetch(value);if(!response.ok)throw new Error('تعذر قراءة المرفق');return response.blob()}
function storageProblem(){let old=document.getElementById('storageFail');if(old)return;const cover=el('div','storage-fail');cover.id='storageFail';const card=el('div','sf-card');card.append(el('h2',null,'تعذر فتح مساحة حفظ البيانات'));card.append(el('p',null,'لم أتمكن من قراءة قاعدة بيانات مساحتي. لم أتعامل مع ذلك على أنه عدم وجود صفحات، حتى لا تظهر بياناتك وكأنها اختفت. جرّب إعادة المحاولة، أو افتح النسخة من موقع HTTPS بدل فتح ملف HTML مباشرة.'));const retry=el('button',null,'إعادة المحاولة');retry.onclick=async()=>{retry.disabled=true;retry.textContent='جاري الفحص...';db=await openDB();const loaded=await loadAll();if(db&&Array.isArray(loaded)){items=loaded;cover.remove();migrateAll();render(true);const lv=ls.get('view','notes');setView(VIEWS.some(v=>v[0]===lv)?lv:'notes');if(FT&&FT.end<=Date.now())fdone()}else{retry.disabled=false;retry.textContent='إعادة المحاولة';toast('ما زالت قاعدة البيانات غير متاحة.')}};card.append(retry);cover.append(card);document.body.append(cover)}
function openTools(){const p=$('appToolsPanel');if(p)p.hidden=false}
function closeTools(){const p=$('appToolsPanel');if(p)p.hidden=true}
async function saveBackupFile(blob,name,handle){
 if(handle){const w=await handle.createWritable();await w.write(blob);await w.close();return 'picker'}
 const file=new File([blob],name,{type:'application/json'});
 if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return 'share'}catch(e){if(e&&e.name==='AbortError')return 'cancel'}}
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return 'download'
}
async function exportBackup(){
 if(!db){toast('التخزين غير متاح؛ لا يمكن إنشاء نسخة كاملة.');return}
 const name='masahaty-backup-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
 let handle=null;
 // اختيار مكان الحفظ لازم يحصل فوراً مع الضغطة (قبل أي انتظار)
 if(window.showSaveFilePicker&&window.isSecureContext){try{handle=await showSaveFilePicker({suggestedName:name,types:[{description:'نسخة مساحتي',accept:{'application/json':['.json']}}]})}catch(e){if(e&&e.name==='AbortError')return;handle=null}}
 const btn=$('backupExport');btn.disabled=true;btn.textContent='جاري تجهيز النسخة...';
 try{
  const all=await loadAll();if(!Array.isArray(all))throw new Error('تعذر قراءة الصفحات');
  const packed=[];for(const item of all){const copy={...item};copy.imgs=await Promise.all((item.imgs||[]).map(blobToDataURL));copy.auds=await Promise.all((item.auds||[]).map(blobToDataURL));packed.push(copy)}
  const prefs={};for(const key of APP_PREF_KEYS){const value=localStorage.getItem(key);if(value!==null)prefs[key]=value}
  const payload={app:'masahaty',formatVersion:1,createdAt:new Date().toISOString(),count:packed.length,items:packed,preferences:prefs};
  const how=await saveBackupFile(new Blob([JSON.stringify(payload)],{type:'application/json'}),name,handle);
  if(how==='cancel'){toast('تم إلغاء الحفظ');return}
  try{localStorage.setItem('lastBackupAt',payload.createdAt)}catch(e){}
  toast(how==='picker'?'تم حفظ النسخة في المكان اللي اخترته ✓':how==='share'?'اختر "حفظ في الملفات" لحفظ النسخة ✓':'تم تنزيل النسخة في مجلد التنزيلات (Downloads) ✓');
 }catch(e){toast('فشل إنشاء النسخة الاحتياطية. تأكد من وجود مساحة كافية.')}finally{btn.disabled=false;btn.textContent='تنزيل نسخة احتياطية'}
}
async function importBackup(file){
 if(!file)return;if(!db){toast('التخزين غير متاح؛ لا يمكن استعادة النسخة.');return}
 try{
  const payload=JSON.parse(await file.text());if(payload.app!=='masahaty'||!(payload.formatVersion>=1)||!Array.isArray(payload.items))throw new Error('ملف غير متوافق');
  const restored=[];for(const source of payload.items){if(!source||typeof source.id!=='string'||typeof source.kind!=='string'||!KINDS[source.kind])throw new Error('بيانات صفحة غير صحيحة');const item={...source};item.imgs=Array.isArray(source.imgs)?await Promise.all(source.imgs.map(dataURLToBlob)):[];item.auds=Array.isArray(source.auds)?await Promise.all(source.auds.map(dataURLToBlob)):[];restored.push(item)}
  if(!confirm('سيتم استبدال صفحات مساحتي الحالية بالنسخة المختارة. يُفضّل تنزيل نسخة احتياطية من بياناتك الحالية أولًا. هل تريد المتابعة؟'))return;
  await new Promise((resolve,reject)=>{const tx=db.transaction('items','readwrite'),store=tx.objectStore('items');store.clear();restored.forEach(item=>store.put(item));tx.oncomplete=resolve;tx.onerror=tx.onabort=()=>reject(tx.error||new Error('تعذر حفظ النسخة'))});
  const prefs=payload.preferences&&typeof payload.preferences==='object'?payload.preferences:{};for(const key of APP_PREF_KEYS){try{if(typeof prefs[key]==='string')localStorage.setItem(key,prefs[key]);else localStorage.removeItem(key)}catch(e){}}
  toast('تمت الاستعادة. جاري تحديث التطبيق...');setTimeout(()=>location.reload(),500);
 }catch(e){toast('تعذر استعادة الملف. تأكد أنه نسخة احتياطية صادرة من مساحتي.')}finally{$('backupImport').value=''}
}
$('appTools').addEventListener('click',openTools);$('toolsClose').addEventListener('click',closeTools);$('appToolsPanel').addEventListener('click',e=>{if(e.target===$('appToolsPanel'))closeTools()});$('backupExport').addEventListener('click',exportBackup);$('backupImport').addEventListener('change',e=>importBackup(e.target.files&&e.target.files[0]));
addEventListener('keydown',e=>{if(e.key==='Escape')closeTools()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>p||navigator.storage.persist()).catch(()=>{});
let view='notes';
const VIEWS=[];
VIEWS.push(['notes','🗂️ مساحتي'],['forest','🌳 الغابة'],['water','💧 مياه'],['tasbih','🕌 دين']);
function renderViews(){const v=$('views');v.innerHTML='';VIEWS.forEach(([k,l])=>{const b=el('button','vbtn');const sp=l.indexOf(' ');b.append(el('span','vic',l.slice(0,sp)),el('span','vlb',l.slice(sp+1)));b.setAttribute('aria-pressed',view===k);b.onclick=()=>setView(k);v.appendChild(b)})}
/* ===== مساحتي: كل حاجة صفحة ===== */
const KINDS={note:['📝','ملاحظة'],task:['✅','مهمة'],event:['⏰','موعد'],list:['📋','قائمة'],shop:['🛒','مشتريات'],habit:['🌱','عادة']};
const EMOJIS=['📝','✅','⏰','📋','🛒','🌱','📔','💡','📚','🎯','💪','🕌','🍃','🎧','✈️','❤️','⭐','🎓'];
const HINT={note:'عنوان الصفحة',task:'إيه المهمة؟',event:'اسم الموعد',list:'اسم القائمة',shop:'قايمة مشتريات',habit:'اسم العادة (مثلاً: أذاكر ساعة)'};
const PARTS=[['am','صباحاً'],['noon','ظهراً'],['pm','مساءً'],['night','ليلاً']];
const DAYS=[['','بدون'],[0,'النهارده'],[1,'بكرة'],[2,'بعد بكرة'],[7,'الأسبوع الجاي']];
let flt='all',q='',cur=null,isNew=false,svT=0,tmP=0,pushed=false,rec=null,chunks=[],strm=null,rtm=null,rs=0;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $$=s=>P.querySelector(s);
const mk=k=>({id:uid(),v:2,kind:k,title:'',body:'',emoji:'',pin:false,created:Date.now(),updated:Date.now(),done:false,w:{d:'',p:''},pri:0,rep:'',place:'',list:[],imgs:[],auds:[],days:{}});
const ttl=i=>i.title||(i.body||'').split('\n')[0].slice(0,50)||KINDS[i.kind][1];
const isEmpty=i=>!i.title&&!i.body&&!i.list.some(x=>x.t)&&!i.imgs.length&&!i.auds.length&&!Object.keys(i.days).length;
function shrink(f){return new Promise(resolve=>{const im=new Image(),url=URL.createObjectURL(f);const finish=v=>{URL.revokeObjectURL(url);resolve(v)};im.onload=()=>{try{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const ctx=c.getContext('2d');if(!ctx)return finish(f);ctx.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>finish(b||f),'image/jpeg',.82)}catch(e){finish(f)}};im.onerror=()=>finish(f);im.src=url})}

/* التاريخ بشكل نسبي (من غير تاريخ محدد) */
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dayKey=off=>{const d=today0();d.setDate(d.getDate()+off);return dk(d)};
const diffDays=k=>Math.round((new Date(k+'T00:00:00')-today0())/864e5);
const num=n=>n.toLocaleString('ar-EG');
function whenLabel(w){
  if(!w||!w.d)return'';
  const n=diffDays(w.d);
  let s=n===0?'النهارده':n===1?'بكرة':n===2?'بعد بكرة':n===-1?'امبارح':n===-2?'من يومين':n<-2?'من '+num(-n)+' أيام':n<=7?new Date(w.d+'T00:00:00').toLocaleDateString('ar-EG',{weekday:'long'}):'بعد '+num(Math.round(n/7))+' أسابيع';
  const p=PARTS.find(x=>x[0]===w.p);return s+(p?' · '+p[1]:'');
}
const late=i=>!i.done&&i.w&&i.w.d&&diffDays(i.w.d)<0;
const wv=i=>(i.w&&i.w.d&&!i.done&&+new Date(i.w.d))||9e15;
function streak(i){let s=0;const d=new Date();if(!i.days[dk(d)])d.setDate(d.getDate()-1);while(i.days[dk(d)]){s++;d.setDate(d.getDate()-1)}return s}
function bestStreak(i){let b=0,c=0,p=null;Object.keys(i.days).sort().forEach(k=>{c=p&&Math.round((new Date(k)-new Date(p))/864e5)===1?c+1:1;if(c>b)b=c;p=k});return b}

/* ترحيل البيانات القديمة */
const toW=due=>{if(!due||typeof due!=='string')return{d:'',p:''};const h=+due.slice(11,13);return{d:due.slice(0,10),p:isNaN(h)?'':h<12?'am':h<15?'noon':h<19?'pm':'night'}};
function migrate(i){
  if(i.v===2)return false;
  const t=String(i.text||'');
  i.kind=({idea:'note',link:'note'})[i.type]||(KINDS[i.type]?i.type:'note');
  i.title='';i.body=i.url?(t+'\n'+i.url).trim():t;
  i.emoji=i.emoji||(i.type==='idea'?'💡':'');i.pin=!!i.pin;i.updated=i.created||Date.now();i.done=!!i.done;
  i.w=toW(i.due);i.pri=i.pri||0;i.rep=i.repeat||'';i.place=i.place||'';i.list=Array.isArray(i.list)?i.list:[];
  i.imgs=i.img?[i.img]:[];i.auds=i.audio?[i.audio]:[];i.days=i.days||{};i.v=2;
  ['type','text','due','img','audio','repeat','url','color','tag'].forEach(k=>delete i[k]);return true;
}
function migrateAll(){
  items.forEach(i=>{if(migrate(i))put(i)});
  if(ls.get('mig2',0))return;
  const hb=ls.get('habits',[]),sh=ls.get('shop',[]);
  if(Array.isArray(hb))hb.forEach(h=>{if(h&&h.name){const n=mk('habit');n.title=String(h.name);n.days=h.days&&typeof h.days==='object'?h.days:{};items.push(n);put(n)}});
  if(Array.isArray(sh)&&sh.length){const n=mk('shop');n.title='مشتريات';n.list=sh.filter(x=>x&&x.name).map(x=>({t:String(x.name),d:!!x.done}));items.push(n);put(n)}
  ls.set('mig2',1);

const reader=el('section','qreader');reader.id='quranReader';reader.hidden=true;reader.setAttribute('role','dialog');reader.setAttribute('aria-modal','true');reader.setAttribute('aria-label','قراءة القرآن');document.body.append(reader);
async function loadQuran(){
  if(quranData)return quranData;
  if(!quranLoading)quranLoading=fetch('quran-pages.json').then(r=>{if(!r.ok)throw new Error('Quran unavailable');return r.json()}).then(d=>{if(d.pages?.length!==604)throw new Error('Invalid Quran');quranData=d.pages;return quranData}).finally(()=>quranLoading=null);
  return quranLoading;
}
function openQuran(){
  reader.hidden=false;document.body.style.overflow='hidden';
  if(!quranPushed){history.pushState({quran:true},'');quranPushed=true}
  showQuranPage();
}
function closeQuran(fromPop){reader.hidden=true;document.body.style.overflow='';if(quranPushed){quranPushed=false;if(!fromPop)history.back()}renderQuranHome();renderDinProgress()}

async function showQuranPage(){
  const page=religion.page;quranVisiblePage=page;quranLoadedPage=0;reader.replaceChildren();
  const head=el('header','qhead'),back=el('button','ch2','→');back.setAttribute('aria-label','إغلاق القرآن');back.onclick=()=>closeQuran();head.append(back,el('b',null,'القرآن الكريم · صفحة '+num(page)+' / ٦٠٤'));
  const body=el('div','qbody'),sheet=el('article','qsheet');sheet.append(el('div','tinfo','جاري تحميل الصفحة…'));body.append(sheet);
  const foot=el('footer','qfoot'),done=el('button','save','✓ أتممت القراءة · الصفحة التالية');done.disabled=true;
  foot.append(el('div','qstatus',DR.totals(religion,PD,dk(new Date()),waterLog()).quran?'✓ ورد اليوم مكتمل · يمكنك مواصلة القراءة':'ورد اليوم: صفحة واحدة'),done);reader.append(head,body,foot);back.focus();
  done.onclick=()=>{
    if(done.disabled||quranLoadedPage!==religion.page||quranVisiblePage!==religion.page)return;
    done.disabled=true;DR.completeReading(religion,dk(new Date()));saveReligion();syncDinHabits();renderQuranHome();renderDinProgress();showQuranPage();
  };
  try{
    const pages=await loadQuran();if(reader.hidden||quranVisiblePage!==page)return;
    sheet.replaceChildren();let surah=0,paragraph;
    pages[page-1].forEach(v=>{
      if(v.surah!==surah){surah=v.surah;sheet.append(el('h2',null,v.name+(v.ayah!==1?' · تابع':'')));paragraph=el('p');sheet.append(paragraph);if(v.ayah===1&&v.surah!==1&&v.surah!==9)paragraph.append(el('div',null,'بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ'))}
      paragraph.append(el('span','qverse',v.text+' '),el('span','qnum','﴿'+num(v.ayah)+'﴾ '));
    });sheet.append(el('small','qref','النص العثماني: Quran.com · تقسيم صفحات المصحف: AlQuran Cloud'));
    quranLoadedPage=page;done.disabled=false;
  }catch(e){
    if(quranVisiblePage!==page)return;sheet.replaceChildren(el('p','tinfo','تعذر تحميل صفحة القرآن. تحقق من اتصالك وحاول مجددًا.'));const retry=el('button','ch2 qretry','إعادة المحاولة');retry.onclick=showQuranPage;sheet.append(retry);
  }
}

<script>
/* ===== 💧 متتبع شرب المياه ===== */
(function(){
const WK='water';
const dflt={goal:2000,cups:[150,250,330,500],log:{},rem:false,remEvery:60,from:8,to:23,weight:0,lastRem:0};
let W=Object.assign({},dflt,ls.get(WK,{}));W.log=W.log||{};
const key=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const sv=()=>{const ks=Object.keys(W.log).sort();ks.slice(0,-60).forEach(k=>delete W.log[k]);ls.set(WK,W)};
const ar=n=>Number(n).toLocaleString('ar-EG');
const today=()=>W.log[key()]||(W.log[key()]=[]);
const sum=k=>(W.log[k]||[]).reduce((a,x)=>a+x.ml,0);
const goalOf=k=>{const e=(W.log[k]||[]);return e.goalAt||W.goal};
const ICON={150:'🥃',250:'🥛',330:'🥤',500:'🍶'};
function streak(){let n=0,d=new Date();if(sum(key(d))<W.goal)d.setDate(d.getDate()-1);while(sum(key(d))>=W.goal){n++;d.setDate(d.getDate()-1)}return n}
function best(){let b=0,c=0;const ks=Object.keys(W.log).sort();let prev=null;ks.forEach(k=>{const ok=sum(k)>=W.goal;const dt=new Date(k);if(ok){c=(prev&&(dt-prev)/864e5<1.5)?c+1:1;b=Math.max(b,c);prev=dt}else{c=0;prev=null}});return b}
let undoT=null,lastAdded=null;
function add(ml){ml=Math.round(+ml);if(!(ml>0&&ml<=3000)){toast('اكتب كمية صحيحة');return}
  const before=sum(key());const t=today();const it={ml,t:Date.now()};t.push(it);lastAdded=it;W.lastRem=Date.now();sv();
  if(navigator.vibrate)navigator.vibrate(15);
  if(before<W.goal&&before+ml>=W.goal){chime();if(navigator.vibrate)navigator.vibrate([60,40,120]);toast('🎉 برافو! خلّصت هدف المياه النهارده');setTimeout(()=>{const b=document.querySelector('.wbot');if(b){b.classList.remove('wcele');void b.offsetWidth;b.classList.add('wcele')}},50)}
  else toast('💧 +'+ar(ml)+' مل');
  renderWater();}
function rm(i){const t=today();t.splice(i,1);sv();renderWater()}
window.renderWater=function(){
  const S=$('water');S.innerHTML='';const box=el('div','wt');S.appendChild(box);
  const k=key(),drank=sum(k),pct=Math.min(100,Math.round(drank/W.goal*100)),left=Math.max(0,W.goal-drank);
  // hero
  const h=el('div','wcard whero');const bot=el('div','wbot');const f=el('div','wfill');f.style.height='0%';bot.append(f,el('div','wpct',ar(pct)+'٪'));
  requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.height=pct+'%'));
  const inf=el('div','winfo');inf.append(el('small',null,'شربت النهارده'),el('b',null,ar(drank)+' مل'),el('small',null,'الهدف: '+ar(W.goal)+' مل'),
    el('small',null,left?('فاضلك '+ar(left)+' مل ≈ '+ar(Math.ceil(left/250))+' كوباية'):'✅ وصلت للهدف!'),
    el('small',null,'🔥 سلسلة: '+ar(streak())+' يوم'));
  const hr=new Date().getHours();if(left&&hr>=W.from&&hr<W.to){const hl=W.to-hr;inf.appendChild(el('small',null,'⏱ محتاج ~'+ar(Math.ceil(left/hl/10)*10)+' مل كل ساعة'))}
  h.append(bot,inf);box.appendChild(h);
  // quick add
  const q=el('div','wcard');q.appendChild(el('div','wh','➕ إضافة سريعة'));const g=el('div','wq');
  W.cups.forEach(ml=>{const b=el('button');b.append(el('span',null,ICON[ml]||'💧'),document.createTextNode(ar(ml)+' مل'));b.onclick=()=>add(ml);g.appendChild(b)});q.appendChild(g);
  const r=el('div','wrow');const inp=el('input');inp.type='number';inp.inputMode='numeric';inp.placeholder='كمية مخصصة (مل)';const ab=el('button',null,'إضافة');ab.onclick=()=>{add(inp.value);};inp.onkeydown=e=>{if(e.key==='Enter')add(inp.value)};r.append(inp,ab);q.appendChild(r);
  if(lastAdded&&today().includes(lastAdded)){const ur=el('div','wrow');const u=el('button','wbtn2','↶ تراجع عن آخر إضافة');u.style.flex='1';u.onclick=()=>{const t=today();const i=t.indexOf(lastAdded);if(i>-1)t.splice(i,1);lastAdded=null;sv();renderWater()};ur.appendChild(u);q.appendChild(ur)}
  box.appendChild(q);
  // log
  const L=el('div','wcard');const t=today();L.appendChild(el('div','wh','📋 سجل النهارده'));
  if(!t.length)L.appendChild(el('div','wtip','لسه مسجّلتش أي مياه النهارده. ابدأ بكوباية دلوقتي 💙'));
  else{const ll=el('div','wlog');t.map((x,i)=>[x,i]).reverse().forEach(([x,i])=>{const row=el('div','wli');row.append(el('span',null,(ICON[x.ml]||'💧')+' '+ar(x.ml)+' مل'));const tm=el('time',null,new Date(x.t).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'}));const d=el('button',null,'✕');d.setAttribute('aria-label','حذف');d.onclick=()=>rm(i);row.append(tm,d);ll.appendChild(row)});L.appendChild(ll)}
  box.appendChild(L);
  // week
  const C=el('div','wcard');const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  const tot=days.map(d=>sum(key(d)));const avg=Math.round(tot.reduce((a,b)=>a+b,0)/7);const hit=tot.filter(x=>x>=W.goal).length;
  const hd=el('div','wh');hd.append(document.createTextNode('📊 آخر ٧ أيام'),el('small',null,'متوسط '+ar(avg)+' مل'));C.appendChild(hd);
  const bars=el('div','wbars');const mx=Math.max(W.goal,...tot);days.forEach((d,i)=>{const b=el('div','wbar'+(tot[i]>=W.goal?' ok':'')+(i===6?' td':''));const bi=el('i');bi.style.height=Math.round(tot[i]/mx*100)+'%';bi.title=ar(tot[i])+' مل';b.append(bi,el('span',null,i===6?'النهارده':d.toLocaleDateString('ar-EG',{weekday:'short'})));bars.appendChild(b)});C.appendChild(bars);
  const st=el('div','wst');st.style.marginTop='12px';[['أيام الهدف',ar(hit)+'/٧'],['أطول سلسلة',ar(best())],['كوبايات النهارده',ar(t.length)]].forEach(([a,b])=>{const d=el('div');d.append(el('b',null,b),document.createTextNode(a));st.appendChild(d)});C.appendChild(st);
  box.appendChild(C);
  // settings
  const Z=el('div','wcard');Z.appendChild(el('div','wh','⚙️ الإعدادات'));
  const r1=el('div','wrow');const gi=el('input');gi.type='number';gi.value=W.goal;gi.setAttribute('aria-label','الهدف اليومي');const gb=el('button',null,'حفظ الهدف');gb.onclick=()=>{const v=+gi.value;if(v>=500&&v<=8000){W.goal=Math.round(v);sv();toast('اتحفظ الهدف');renderWater()}else toast('الهدف بين ٥٠٠ و ٨٠٠٠ مل')};r1.append(el('span',null,'الهدف (مل)'),gi,gb);Z.appendChild(r1);
  const r2=el('div','wrow');const wi=el('input');wi.type='number';wi.placeholder='وزنك (كجم)';if(W.weight)wi.value=W.weight;const wb=el('button','wbtn2','احسب لي');wb.onclick=()=>{const v=+wi.value;if(v>=20&&v<=250){W.weight=v;W.goal=Math.round(v*33/50)*50;sv();toast('هدفك المقترح '+ar(W.goal)+' مل');renderWater()}else toast('اكتب وزن صحيح')};r2.append(wi,wb);Z.appendChild(r2);
  Z.appendChild(el('div','wtip','الحساب: حوالي ٣٣ مل لكل كيلو من وزنك. زوّد في الحر أو الرياضة.'));
  const r3=el('div','wrow');const ci=el('input');ci.value=W.cups.join(', ');ci.setAttribute('aria-label','أحجام الكوبايات');const cb=el('button','wbtn2','حفظ الأحجام');cb.onclick=()=>{const a=ci.value.split(/[,،\s]+/).map(Number).filter(x=>x>0&&x<=3000).slice(0,4);if(a.length){W.cups=a;sv();renderWater();toast('اتحفظت الأحجام')}else toast('اكتب أرقام زي: 200, 300')};r3.append(ci,cb);Z.appendChild(r3);
  // reminders
  const sw=el('label','wsw');const cbx=el('input');cbx.type='checkbox';cbx.checked=W.rem;sw.append(el('span',null,'🔔 فكّرني أشرب مياه'),cbx);Z.appendChild(sw);
  cbx.onchange=async()=>{W.rem=cbx.checked;if(W.rem&&'Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}W.lastRem=Date.now();sv();toast(W.rem?'هفكرك كل '+ar(W.remEvery)+' دقيقة':'التذكير اتقفل');renderWater()};
  if(W.rem){const r4=el('div','wrow');const ev=el('select');[30,45,60,90,120].forEach(m=>{const o=el('option',null,'كل '+ar(m)+' دقيقة');o.value=m;if(m===W.remEvery)o.selected=true;ev.appendChild(o)});ev.onchange=()=>{W.remEvery=+ev.value;sv()};
    const fr=el('select'),to=el('select');for(let i=0;i<24;i++){const a=el('option',null,'من '+ar(i)+':٠٠');a.value=i;if(i===W.from)a.selected=true;fr.appendChild(a);const b=el('option',null,'لـ '+ar(i)+':٠٠');b.value=i;if(i===W.to)b.selected=true;to.appendChild(b)}
    fr.onchange=()=>{W.from=+fr.value;sv()};to.onchange=()=>{W.to=+to.value;sv()};r4.append(ev);Z.appendChild(r4);const r5=el('div','wrow');r5.append(fr,to);Z.appendChild(r5);
    Z.appendChild(el('div','wtip','التذكير بيشتغل والتطبيق مفتوح. لو وصلت للهدف مش هيزعجك.'))}
  const r6=el('div','wrow');const rs=el('button','wbtn2','🗑 مسح سجل النهارده');rs.style.flex='1';rs.onclick=()=>{if(sure(rs)){W.log[key()]=[];lastAdded=null;sv();renderWater();toast('اتمسح')}};r6.appendChild(rs);Z.appendChild(r6);
  box.appendChild(Z);

};
setInterval(()=>{if(!W.rem)return;const n=new Date(),h=n.getHours();if(h<W.from||h>=W.to)return;if(sum(key())>=W.goal)return;
  if(Date.now()-(W.lastRem||0)<W.remEvery*6e4)return;W.lastRem=Date.now();sv();
  const msg='💧 وقت كوباية مياه! فاضلك '+ar(W.goal-sum(key()))+' مل';toast(msg);chime();if(navigator.vibrate)navigator.vibrate([100,60,100]);
  try{if('Notification' in window&&Notification.permission==='granted')new Notification('مساحتي',{body:msg})}catch(e){}},30000);
if(view==='water')renderWater();
})();
